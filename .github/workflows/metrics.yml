name: Metrics
on:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours
  workflow_dispatch:          # allows manual trigger
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: royzhang7
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes                      # counts private repo contributions
          config_octicon: yes
          config_display: large
          filename: github-metrics.svg

          # Isometric commit calendar (shows private contributions in color)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Recent activity — with timeout to avoid flaky errors
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_filter: commit, pr, issue
          plugin_activity_load: 300
          plugin_activity_visibility: all

          plugin_followup: yes
          plugin_followup_sections: repositories

          plugin_people: yes
          plugin_people_types: contributors, stargazers, watchers, sponsors
