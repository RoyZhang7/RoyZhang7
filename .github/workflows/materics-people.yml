      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: royzhang7
          template: repository
          repo: kv-loadbalancer-nfv
          filename: github-metrics-people-pre-kv-loadbalancer.svg
          base: ""
          plugin_people: yes
          plugin_people_types: contributors, stargazers, watchers
